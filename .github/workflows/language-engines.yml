name: Language CPU engine packages
on:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Include Windows and macOS for the final platform validation'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/artifact_io.py'
      - 'engines/build_language.py'
      - 'engines/language_main.py'
      - 'src/learning/**'
      - 'test_language_half_tensors.py'
      - 'test_language_math_tensors.py'
      - 'test_language_retention_tensors.py'
      - 'test_language_finite_step_tensors.py'
      - 'test_language_group_direction_tensors.py'
      - 'test_language_finite_job_tensors.py'
      - 'test_language_streamed_float_tensors.py'
      - 'test_language_block_tensors.py'
      - 'test_language_block_quality_tensors.py'
      - 'test_language_selector_tensors.py'
      - 'test_language_selector_job_tensors.py'
      - 'test_language_specialist_tensors.py'
      - 'test_language_specialist_job_tensors.py'
      - 'test_language_specialist_answers_tensors.py'
      - 'test_language_outcome_job_tensors.py'
      - 'test_language_outcome_selector_tensors.py'
      - 'test_public_math.py'
      - 'test_engine_qualification.py'
      - 'test_public_math_tensors.py'
      - 'src/network/engine_profiles.py'
      - '.github/workflows/language-engines.yml'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.all_platforms == true && '["ubuntu-24.04", "windows-2025", "macos-15"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.0
      - run: python -m pip install -r engines/requirements-cpu.txt -r src/learning/requirements-research.txt PyInstaller==6.22.3 pytest==8.4.2
      - run: python -m pytest -q test_language_adapter.py test_language_gradient.py test_language_candidate.py test_language_half_tensors.py test_language_math_tensors.py test_language_retention_tensors.py test_language_finite_step_tensors.py test_language_group_direction_tensors.py test_language_finite_job_tensors.py test_language_streamed_float_tensors.py test_language_block_tensors.py test_language_block_quality_tensors.py test_language_selector_tensors.py test_language_selector_job_tensors.py test_language_specialist_tensors.py test_language_specialist_job_tensors.py test_language_specialist_answers_tensors.py test_language_outcome_job_tensors.py test_language_outcome_selector_tensors.py test_public_math_tensors.py test_public_quality.py test_engine_package.py test_engine_qualification.py test_engine_download.py test_language_install.py
      - run: python engines/build_language.py --device cpu --output language-package
      - name: Verify frozen model architecture and adapter fixture
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            language-package/dist/LixySwarmLanguageCPU/LixySwarmLanguageCPU.exe --self-test --report language-package/report.json
          else
            language-package/dist/LixySwarmLanguageCPU/LixySwarmLanguageCPU --self-test --report language-package/report.json
          fi
          python -c 'import json; assert json.load(open("language-package/report.json"))["success"]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: LixySwarmLanguageCPU-${{ matrix.os }}
          path: |
            language-package/dist/
            language-package/report.json
          retention-days: 1
