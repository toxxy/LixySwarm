name: CPU engine packages

on:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Include Windows and macOS for the final platform validation'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/artifact_io.py'
      - 'engines/**'
      - 'src/network/reference_job.py'
      - 'src/network/reference_model.py'
      - 'src/network/engine_package.py'
      - 'src/network/own_*.py'
      - 'src/network/local_own_work.py'
      - 'src/network/compute_process.py'
      - 'src/network/engine_profiles.py'
      - 'src/network/engine_cache.py'
      - 'test_engine_cache.py'
      - 'src/agents/**'
      - 'src/swarm/**'
      - 'src/matriarca/**'
      - 'src/learning/**'
      - 'test_collective_learning.py'
      - 'test_causal_swarm.py'
      - 'test_swarm_distributed.py'
      - 'test_own_network.py'
      - 'test_own_preparation.py'
      - 'test_swarm_bootstrap_tensors.py'
      - 'test_swarm_distributed_tensors.py'
      - 'test_engine_archive.py'
      - 'test_engine_qualification.py'
      - 'test_swarm_selection.py'
      - '.github/workflows/engines.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.all_platforms == true && '["ubuntu-22.04", "windows-2025", "macos-15"]' || '["ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install the CPU-only tensor runtime
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.12.0
      - name: Install engine and build dependencies
        run: python -m pip install -r engines/requirements-cpu.txt PyInstaller==6.22.3 pytest==8.4.2 safetensors==0.7.0 certifi==2026.7.22
      - name: Verify package trust and permissions
        run: python -m pytest -q test_engine_package.py test_engine_cache.py test_engine_archive.py test_engine_qualification.py test_compute_process.py test_language_adapter.py test_language_gradient.py test_public_quality.py test_collective_learning.py test_swarm_selection.py test_causal_swarm.py test_swarm_distributed.py test_swarm_distributed_tensors.py test_own_network.py test_own_preparation.py test_swarm_bootstrap_tensors.py
      - name: Build a separate CPU engine
        run: python engines/build.py --output engine-package --bootstrap
      - name: Execute frozen inference and gradient checks
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            engine-package/dist/LixySwarmEngineCPU/LixySwarmEngineCPU.exe --self-test --report engine-package/report.json
          else
            engine-package/dist/LixySwarmEngineCPU/LixySwarmEngineCPU --self-test --report engine-package/report.json
          fi
          python -c 'import json; assert json.load(open("engine-package/report.json"))["success"]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: LixySwarmEngineCPU-${{ matrix.os }}
          path: |
            engine-package/dist/
            engine-package/report.json
          retention-days: 1
