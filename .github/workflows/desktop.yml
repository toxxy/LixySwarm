name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: 'Include Windows and macOS for the final platform validation'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/artifact_io.py'
      - 'src/version.py'
      - 'test_runtime_upgrade.py'
      - 'test_web_chat.py'
      - 'test_own_swarm.py'
      - 'test_local_own_work.py'
      - 'test_own_state.py'
      - 'test_swarm_distributed.py'
      - 'src/learning/swarm_distributed.py'
      - 'api/**'
      - 'test_desktop_state.py'
      - 'test_cold_recovery.py'
