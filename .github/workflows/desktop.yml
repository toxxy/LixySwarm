      - 'test_language_repair_comparison.py'
      - 'test_language_repair_calibration.py'
      - 'test_language_response_router.py'
      - 'src/learning/language_response_*.py'
      - 'experiments/fit_response_router.py'
      - 'src/learning/language_repair_calibration*.py'
      - 'experiments/collect_repair_calibration.py'
      - 'test_language_cache_repair.py'
      - 'experiments/cold_recovery.py'
      - 'experiments/cold_checkpoint.py'
      - 'experiments/cold_inventory.py'
      - 'experiments/cold_native_trial.py'
      - 'experiments/recover_native_cache.py'
      - 'experiments/compare_format_recovery.py'
      - 'src/learning/language_repair_comparison*.py'
      - 'experiments/cold_donation_watch.py'
      - 'desktop/**'
      - 'client_daemon.py'
      - 'src/network/**'
      - 'src/contribution/**'
      - 'src/release/**'
      - 'src/learning/public_*.py'
      - 'test_public_knowledge.py'
      - 'test_chat_service.py'
      - 'test_chat_versions.py'
      - 'test_language_family.py'
      - 'test_language_training.py'
      - 'test_language_activation.py'
      - 'test_language_replication.py'
      - 'experiments/replicate_language_version.py'
      - 'experiments/language_gradient_probe.py'
      - 'experiments/compare_language_scaling.py'
      - 'src/learning/language_scaling.py'
      - 'test_language_gradient_probe.py'
      - 'test_language_scaling.py'
      - 'experiments/publish_language_update.py'
      - 'test_publish_language_update.py'
      - 'test_language_learning.py'
      - 'test_language_follow.py'
      - 'test_peer_exchange.py'
      - 'test_language_capacity.py'
      - 'test_language_batches.py'
      - 'test_local_language_work.py'
      - 'src/learning/language_policy.py'
      - 'src/learning/language_capacity.py'
      - 'test_artifact_codec.py'
      - 'test_artifact_pipeline.py'
      - 'test_compute_sandbox.py'
      - 'test_compute_process.py'
      - 'test_artifact_store.py'
      - 'test_engine_cache.py'
      - 'experiments/maintain_engine_cache.py'
      - 'test_node_telemetry.py'
      - 'test_internet_observation.py'
      - 'experiments/observe_internet.py'
      - 'test_language_candidate_service.py'
      - 'test_language_preparation.py'
      - 'test_public_quality.py'
      - 'test_language_versions.py'
      - 'test_public_language_gate.py'
      - 'test_public_teaching.py'
      - 'test_public_math.py'
      - 'test_personal_context.py'
      - 'test_public_memory.py'
      - 'test_report_privacy.py'
      - 'test_language_half.py'
      - 'test_language_math.py'
      - 'test_language_retention.py'
