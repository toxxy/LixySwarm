name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'client_daemon.py'
      - 'src/network/**'
      - 'src/contribution/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated desktop dependencies
        run: python -m pip install -r desktop/requirements.txt PyInstaller==6.22.3 pytest==8.4.2
      - name: Check controls and encrypted personal persistence
        run: python -m pytest -q test_desktop_state.py
      - name: Build bundled application
        run: python desktop/build.py --output package
      - name: Verify executable without launching system Python
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            package/dist/LixySwarm/LixySwarm.exe --self-test --report package/report.json --screenshot package/preview.png
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            package/dist/LixySwarm.app/Contents/MacOS/LixySwarm --self-test --report package/report.json --screenshot package/preview.png
          else
            package/dist/LixySwarm/LixySwarm --self-test --report package/report.json --screenshot package/preview.png
          fi
          python -c 'import json; assert json.load(open("package/report.json"))["success"]'
      - name: Record package checksums
        run: python desktop/checksums.py package/dist package/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: LixySwarm-${{ matrix.os }}
          path: |
            package/dist/
            package/report.json
            package/preview.png
            package/SHA256SUMS.txt
          retention-days: 1
