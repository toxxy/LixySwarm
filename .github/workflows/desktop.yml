      - 'experiments/prepare_public_math.py'
      - 'experiments/evaluate_public_math.py'
      - 'test_adapter_format.py'
      - '.github/workflows/desktop.yml'
      - '.gitmodules'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.all_platforms == true && '["ubuntu-22.04", "windows-2025", "macos-15"]' || '["ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install isolated desktop dependencies
        run: python -m pip install -r desktop/requirements.txt PyInstaller==6.22.3 pytest==8.4.2 fastapi==0.136.3
      - name: Provide portable Linux graphics libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-util1 libxcb-xkb1 bubblewrap
      - name: Check controls and encrypted personal persistence
        run: python -m pytest -q test_desktop_state.py test_runtime_upgrade.py test_chat_service.py test_chat_versions.py test_language_family.py test_language_versions.py test_adapter_format.py test_public_language_gate.py test_public_teaching.py test_public_math.py test_personal_context.py test_public_memory.py test_public_knowledge.py test_release_history.py test_compute_process.py test_compute_sandbox.py test_learning_coordinator.py test_engine_package.py test_engine_cache.py test_engine_archive.py test_engine_qualification.py test_engine_download.py test_language_compute.py test_language_training.py test_language_activation.py test_language_replication.py test_language_cache_repair.py test_cold_recovery.py test_cold_inventory.py test_cold_native_trial.py test_recover_native_cache.py test_language_candidate_service.py test_public_quality.py test_language_preparation.py test_node_telemetry.py test_internet_observation.py test_language_gradient_probe.py test_language_scaling.py test_publish_language_update.py test_language_learning.py test_language_follow.py test_peer_exchange.py test_language_capacity.py test_artifact_codec.py test_artifact_pipeline.py test_artifact_store.py test_work_protocol.py test_language_batches.py test_local_language_work.py test_report_privacy.py test_language_half.py test_language_math.py test_language_retention.py test_language_finite_protocol.py test_language_block_protocol.py test_language_selector_protocol.py test_language_specialist_protocol.py test_language_outcomes.py test_language_outcome_selector.py test_language_prefix_router.py test_language_repair_comparison.py test_language_repair_calibration.py test_language_response_router.py test_web_chat.py test_own_swarm.py test_local_own_work.py test_swarm_distributed.py test_own_state.py
      - name: Build bundled application
        run: python desktop/build.py --output package
      - name: Verify executable without launching system Python
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            package/dist/LixySwarm/LixySwarm.exe --self-test --prepare-engine --report package/report.json --screenshot package/preview.png
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            package/dist/LixySwarm.app/Contents/MacOS/LixySwarm --self-test --prepare-engine --report package/report.json --screenshot package/preview.png
          else
            package/dist/LixySwarm/LixySwarm --self-test --prepare-engine --report package/report.json --screenshot package/preview.png
          fi
          python -c 'import json; assert json.load(open("package/report.json"))["success"]'
      - name: Record package checksums
        run: python desktop/checksums.py package/dist package/SHA256SUMS.txt
      - name: Preserve native bundles in public release archives
        run: python desktop/package_release.py package/dist package/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: LixySwarm-${{ matrix.os }}
          path: |
            package/dist/
            package/report.json
            package/preview.png
            package/SHA256SUMS.txt
            package/release/
          retention-days: 1
