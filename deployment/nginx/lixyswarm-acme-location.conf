# Include inside the existing HTTP port-80 server. A server-level return must
# remain in location / instead, so the challenge can reach this webroot.
location ^~ /.well-known/acme-challenge/ {
    root /var/lib/lixyswarm-acme/webroot;
    default_type text/plain;
    try_files $uri =404;
    limit_except GET { deny all; }
}
