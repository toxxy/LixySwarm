# Keep existing public telemetry working while moving chat to TLS.
# Enable only after lixyswarm-https.conf has a valid certificate.
server {
    listen 8080;

    root /opt/lixyswarm/frontend;
    index swarm-explorer.html;

    location = /chat.html {
        return 308 https://31.97.9.54:8443/chat.html;
    }

    # Do not redirect POST bodies received on the legacy plaintext endpoint.
    # Clients must select the HTTPS API before sending their question.
    location ^~ /api/chat {
        default_type application/json;
        return 426 '{"ok":false,"error":"Usa el chat HTTPS en https://31.97.9.54:8443/chat.html"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
