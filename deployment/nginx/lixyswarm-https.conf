# Public HTTPS entry point independent of the existing domain virtual hosts.
# Obtain the IP certificate before enabling this file.
limit_req_zone $binary_remote_addr zone=LixySwarmChat:1m rate=6r/m;
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 31.97.9.54;

    ssl_certificate /etc/lixyswarm-acme/live/lixyswarm-ip/fullchain.pem;
    ssl_certificate_key /etc/lixyswarm-acme/live/lixyswarm-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LixySwarmTLS:1m;
    ssl_session_tickets off;

    root /opt/lixyswarm/frontend;
    index swarm-explorer.html;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 75s;
    }

    location = /api/chat {
        limit_req zone=LixySwarmChat burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:8001/chat;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
